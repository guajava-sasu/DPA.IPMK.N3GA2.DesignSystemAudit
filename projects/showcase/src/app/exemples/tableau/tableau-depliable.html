<div class="gui-table">
  <table mat-table [dataSource]="lignes()" aria-label="Coulées et bobines">
    <ng-container matColumnDef="bascule">
      <th mat-header-cell *matHeaderCellDef class="gui-col-expand">
        <span class="gui-sr-only">Déplier</span>
      </th>
      <td mat-cell *matCellDef="let l" class="gui-col-expand">
        @if (!l.parent) {
          <button
            matIconButton
            class="gui-neutral gui-sm"
            [attr.aria-expanded]="ouvertes().has(l.code)"
            [attr.aria-label]="(ouvertes().has(l.code) ? 'Replier ' : 'Déplier ') + l.code"
            (click)="basculer(l.code)"
          >
            <mat-icon>{{ ouvertes().has(l.code) ? 'expand_less' : 'expand_more' }}</mat-icon>
          </button>
        }
      </td>
    </ng-container>
    <ng-container matColumnDef="code">
      <th mat-header-cell *matHeaderCellDef>Coulée / bobine</th>
      <td mat-cell *matCellDef="let l" [class.gui-nested]="l.parent">
        @if (l.parent) {
          <span class="gui-nested-inner"
            ><mat-icon>subdirectory_arrow_right</mat-icon>{{ l.code }}</span
          >
        } @else {
          {{ l.code }}
        }
      </td>
    </ng-container>
    <ng-container matColumnDef="nuance">
      <th mat-header-cell *matHeaderCellDef>Nuance</th>
      <td mat-cell *matCellDef="let l">{{ l.nuance }}</td>
    </ng-container>
    <ng-container matColumnDef="poids">
      <th mat-header-cell *matHeaderCellDef class="gui-numeric">Poids (t)</th>
      <td mat-cell *matCellDef="let l" class="gui-numeric">{{ l.poids | number: '1.1-1' }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="colonnes"></tr>
    <tr mat-row *matRowDef="let l; columns: colonnes" [class.gui-nested-row]="l.parent"></tr>
  </table>
</div>
