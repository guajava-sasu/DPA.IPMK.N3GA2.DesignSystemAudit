<div class="gui-table">
  <div class="gui-table-header">
    <div class="gui-table-header-texts">
      <h3 class="gui-table-title" id="ex-bobines-titre">Bobines de la semaine</h3>
      <p class="gui-table-description">Bobines mères entrées sur la ligne depuis lundi</p>
    </div>
    <div class="gui-table-actions">
      <button matButton="outlined" class="gui-neutral gui-sm">Exporter</button>
    </div>
  </div>
  <div class="gui-table-scroll">
    <table mat-table [dataSource]="source" matSort aria-labelledby="ex-bobines-titre">
      <ng-container matColumnDef="choix">
        <th mat-header-cell *matHeaderCellDef class="gui-col-checkbox">
          <mat-checkbox
            [checked]="toutCoche()"
            [indeterminate]="choix.hasValue() && !toutCoche()"
            (change)="basculerTout()"
            aria-label="Tout sélectionner"
          ></mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let b" class="gui-col-checkbox">
          <mat-checkbox
            [checked]="choix.isSelected(b)"
            (change)="choix.toggle(b)"
            [aria-label]="'Sélectionner ' + b.reference"
          ></mat-checkbox>
        </td>
      </ng-container>
      <ng-container matColumnDef="reference">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Référence</th>
        <td mat-cell *matCellDef="let b">{{ b.reference }}</td>
      </ng-container>
      <ng-container matColumnDef="nuance">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nuance</th>
        <td mat-cell *matCellDef="let b">{{ b.nuance }}</td>
      </ng-container>
      <ng-container matColumnDef="epaisseur">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
          arrowPosition="before"
          class="gui-numeric"
        >
          Épaisseur (mm)
        </th>
        <td mat-cell *matCellDef="let b" class="gui-numeric">
          {{ b.epaisseur | number: '1.2-2' }}
        </td>
      </ng-container>
      <ng-container matColumnDef="poids">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
          arrowPosition="before"
          class="gui-numeric"
        >
          Poids (t)
        </th>
        <td mat-cell *matCellDef="let b" class="gui-numeric">{{ b.poids | number: '1.1-1' }}</td>
      </ng-container>
      <ng-container matColumnDef="statut">
        <th mat-header-cell *matHeaderCellDef>Statut</th>
        <td mat-cell *matCellDef="let b">
          <span class="gui-badge" [class]="'gui-' + b.statut.couleur">{{ b.statut.libelle }}</span>
        </td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="gui-col-actions">
          <span class="gui-sr-only">Actions</span>
        </th>
        <td mat-cell *matCellDef="let b" class="gui-col-actions">
          <button
            matIconButton
            class="gui-neutral gui-sm"
            [attr.aria-label]="'Modifier ' + b.reference"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            matIconButton
            class="gui-neutral gui-sm"
            [attr.aria-label]="'Autres actions pour ' + b.reference"
          >
            <mat-icon>more_vert</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="colonnes"></tr>
      <tr
        mat-row
        *matRowDef="let b; columns: colonnes"
        [class.gui-selected]="choix.isSelected(b)"
      ></tr>
    </table>
  </div>
  <mat-paginator
    [pageSize]="5"
    showFirstLastButtons
    [pageSizeOptions]="[5, 10, 25]"
    aria-label="Pagination des bobines"
  ></mat-paginator>
</div>
