<div class="ex">
  <fieldset class="gui-group">
    <legend>Sites concernés</legend>
    <div class="gui-group-items">
      <mat-checkbox checked>Florange</mat-checkbox>
      <mat-checkbox>Montataire</mat-checkbox>
      <mat-checkbox>Mouzon</mat-checkbox>
    </div>
    <p class="gui-group-helper">Un ou plusieurs sites</p>
  </fieldset>
  <fieldset class="gui-group gui-error" aria-describedby="ex-sites-erreur">
    <legend>Contrôles effectués</legend>
    <div class="gui-group-items">
      <mat-checkbox>Aspect</mat-checkbox>
      <mat-checkbox>Épaisseur de zinc</mat-checkbox>
      <mat-checkbox>Planéité</mat-checkbox>
    </div>
    <p class="gui-group-error" id="ex-sites-erreur">Sélectionnez au moins un contrôle</p>
  </fieldset>
  <fieldset class="gui-group gui-horizontal">
    <legend>Faces</legend>
    <div class="gui-group-items">
      <mat-checkbox checked>Supérieure</mat-checkbox>
      <mat-checkbox checked>Inférieure</mat-checkbox>
    </div>
  </fieldset>
</div>
