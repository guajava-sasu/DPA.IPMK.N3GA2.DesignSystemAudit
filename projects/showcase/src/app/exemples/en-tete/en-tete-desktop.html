<header class="gui-header">
  <div class="gui-header-brand">
    <span class="marque">GALMA2</span><span class="ligne">Ligne de galvanisation</span>
  </div>
  <div class="gui-header-actions">
    <button matButton="filled">Nouvelle bobine</button>
    <span class="gui-status gui-success">En marche</span>
    <span class="gui-tag gui-grey gui-sm">Poste B</span>
    <div class="gui-header-notifications">
      <button matIconButton class="gui-neutral" aria-label="Notifications, 3 nouvelles">
        <mat-icon>notifications</mat-icon>
      </button>
      <span class="gui-count gui-sm" aria-hidden="true">3</span>
    </div>
    <div class="gui-header-account">
      <span class="gui-avatar gui-sm" aria-hidden="true">AG</span>
      <div class="gui-header-account-texts">
        <span class="gui-header-account-name">Alaa G.</span>
        <span class="gui-header-account-role">Chef de poste</span>
      </div>
      <button matIconButton class="gui-neutral gui-sm" aria-label="Compte d’Alaa G.">
        <mat-icon>expand_more</mat-icon>
      </button>
    </div>
  </div>
</header>
