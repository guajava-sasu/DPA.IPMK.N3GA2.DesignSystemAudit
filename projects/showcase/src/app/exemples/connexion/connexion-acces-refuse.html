<section class="gui-login-panel" aria-labelledby="ex-login-refus">
  <div class="gui-login-logo"><span class="marque">GALMA2</span></div>
  <h2 id="ex-login-refus" class="gui-login-title">Accès refusé</h2>
  <div class="gui-message gui-soft gui-error" role="alert">
    <span class="material-icons gui-message-icon" aria-hidden="true">error</span>
    <div class="gui-message-content">
      <p class="gui-message-text">
        Votre compte n’a pas de droit sur cette application. Demandez l’accès à votre responsable de poste.
      </p>
    </div>
  </div>
  <button matButton="outlined" class="gui-neutral">
    <mat-icon>arrow_back</mat-icon>
    Retour
  </button>
</section>
