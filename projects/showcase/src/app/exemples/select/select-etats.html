<div class="ex">
  <div class="gui-field">
    <label class="gui-field-label" id="ex-dest-l">Destination</label>
    <mat-form-field>
      <mat-select aria-labelledby="ex-dest-l" [formControl]="destination" placeholder="Choisir">
        <mat-option value="stock">Stock</mat-option>
        <mat-option value="expedition">Expédition</mat-option>
      </mat-select>
      <mat-error>La destination est obligatoire</mat-error>
    </mat-form-field>
  </div>
  <div class="gui-field">
    <label class="gui-field-label" id="ex-ligne-l">Ligne</label>
    <mat-form-field>
      <mat-select aria-labelledby="ex-ligne-l" value="g2" disabled>
        <mat-option value="g2">Galma 2</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
</div>
