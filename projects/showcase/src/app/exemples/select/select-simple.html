<div class="ex">
  <div class="gui-field">
    <label class="gui-field-label" id="ex-nuance-l">Nuance</label>
    <mat-form-field>
      <mat-select aria-labelledby="ex-nuance-l" placeholder="Choisir une nuance" value="dx51d">
        <mat-option value="dx51d">DX51D</mat-option>
        <mat-option value="dx52d">DX52D</mat-option>
        <mat-option value="dx53d">DX53D</mat-option>
        <mat-option value="dx54d" disabled>DX54D (épuisée)</mat-option>
        <mat-option value="s250gd">S250GD</mat-option>
      </mat-select>
      <mat-hint>Selon la commande client</mat-hint>
    </mat-form-field>
  </div>
  <div class="gui-field gui-sm">
    <label class="gui-field-label" id="ex-revet-l">Revêtement (Small)</label>
    <mat-form-field>
      <mat-select aria-labelledby="ex-revet-l" placeholder="Choisir">
        <mat-option value="z100">Z100</mat-option>
        <mat-option value="z140">Z140</mat-option>
        <mat-option value="z275">Z275</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
</div>
