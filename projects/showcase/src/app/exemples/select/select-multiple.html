<div class="ex">
  <div class="gui-field">
    <label class="gui-field-label" id="ex-defauts-l">Défauts relevés</label>
    <mat-form-field>
      <mat-select
        aria-labelledby="ex-defauts-l"
        multiple
        [value]="['coulure']"
        placeholder="Choisir"
      >
        <mat-option value="coulure">Coulure</mat-option>
        <mat-option value="crasse">Crasse</mat-option>
        <mat-option value="rayure">Rayure</mat-option>
        <mat-option value="non-revetu">Non revêtu</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
</div>
